name: Linux hosted quick

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-hosted-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-object:
    name: Emit Linux seed object
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Jiang 0.5.0 stable
        env:
          ARCHIVE_SHA256: 3ea8db0271e43f593f461eaccfbc47f2689a533df7884f7cef668be558984bfb
        run: |
          archive="$RUNNER_TEMP/jiang-0.5.0-macos-arm64.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/jjcfun/jiang/releases/download/0.5.0/jiang-0.5.0-macos-arm64.zip
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/jiang-0.5.0"

      - name: Emit reproducible Linux object
        env:
          BOOTSTRAP_BIN: ${{ runner.temp }}/jiang-0.5.0/jiang-0.5.0-macos-arm64/bin/jiangc
        run: bash ./script/linux_port_seed.sh emit-object

      - name: Upload Linux seed inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-port-seed-${{ github.sha }}
          path: |
            build/linux-port-seed/jiangc-x86_64-linux-gnu.o
            build/linux-port-seed/jiangc-x86_64-linux-gnu.manifest
          if-no-files-found: error
          retention-days: 3

  linux-hosted:
    name: Bootstrap and smoke
    needs: seed-object
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Restore managed LLVM
        id: llvm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/llvm/linux-x86_64/install
          key: linux-x86_64-llvm-22.1.8-ca7933e47d3a3451d81e72ac174dcb5aa28b59d1-v1

      - name: Check LLVM build prerequisites
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          command -v cmake
          command -v ninja
          command -v clang
          command -v clang++

      - name: Build managed LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          JIANG_LLVM_TARGETS: X86
          JIANG_LLVM_PARALLEL: 2
        run: bash ./script/install_llvm.sh --local

      - name: Download Linux seed inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-port-seed-${{ github.sha }}
          path: build/linux-port-seed

      - name: Bootstrap Linux stable
        run: bash ./script/linux_port_seed.sh bootstrap

      - name: Check compiler dynamic dependencies
        run: |
          readelf -d build/bin/jiangc
          if ldd build/bin/jiangc | grep -E 'lib(LLVM|lld)'; then
            echo 'Linux compiler must not dynamically depend on LLVM/lld' >&2
            exit 1
          fi

      - name: Run hosted process smoke
        run: JIANGC=build/bin/jiangc bash ./script/linux_hosted_process_smoke.sh

      - name: Run hosted runtime smoke
        run: JIANGC=build/bin/jiangc bash ./script/linux_hosted_runtime_smoke.sh

      - name: Upload seed manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-seed-manifest-${{ github.sha }}
          path: build/linux-port-seed/jiangc-x86_64-linux-gnu.manifest
          if-no-files-found: warn
          retention-days: 7
