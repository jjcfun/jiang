name: Linux hosted full

on:
  workflow_call:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-hosted-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-object:
    name: Emit Linux seed object
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LLVM_SDK_CACHE_KEY: macos-arm64-user-jiang-llvm-22.1.8-1-15cf20d4e314879e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download Jiang 0.5.0 stable
        env:
          ARCHIVE_SHA256: 3ea8db0271e43f593f461eaccfbc47f2689a533df7884f7cef668be558984bfb
        run: |
          archive="$RUNNER_TEMP/jiang-0.5.0-macos-arm64.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/jjcfun/jiang/releases/download/0.5.0/jiang-0.5.0-macos-arm64.zip
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/jiang-0.5.0"

      - name: Restore managed LLVM SDK
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jiang/toolchains/llvm/22/darwin-arm64
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Install managed LLVM SDK
        run: bash ./script/install_llvm.sh --user

      - name: Save managed LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jiang/toolchains/llvm/22/darwin-arm64
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Checkout Jiang 0.5.1 bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 3d29409aa4708fa52203251ded5f2c35d83762b5
          path: build/bootstrap-0.5.1

      - name: Build Jiang 0.5.1 bootstrap
        env:
          BOOTSTRAP_BIN: ${{ runner.temp }}/jiang-0.5.0/jiang-0.5.0-macos-arm64/bin/jiangc
        run: |
          BOOTSTRAP_RELEASE_VERSION=0.5.0 \
          BOOTSTRAP_DEPTH=next \
          VERIFY=none \
          bash ./build/bootstrap-0.5.1/script/build_next.sh

      - name: Emit reproducible Linux object
        env:
          BOOTSTRAP_BIN: ${{ github.workspace }}/build/bootstrap-0.5.1/build/bin/jiangc.next
          BOOTSTRAP_RELEASE_VERSION: 0.5.1
        run: bash ./script/linux_port_seed.sh emit-object

      - name: Upload Linux seed inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-full-port-seed-${{ github.sha }}
          path: |
            build/linux-port-seed/jiangc-x86_64-linux-gnu.o
            build/linux-port-seed/jiangc-x86_64-linux-gnu.manifest
          if-no-files-found: error
          retention-days: 3

  linux-full:
    name: Bootstrap, full test, and package
    needs: seed-object
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      LLVM_SDK_CACHE_KEY: linux-x86_64-jiang-llvm-22.1.8-1-42596f306bfa7af4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore managed LLVM SDK
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llvm/linux-x86_64/install
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Install managed LLVM SDK
        run: bash ./script/install_llvm.sh --local

      - name: Save managed LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llvm/linux-x86_64/install
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Download Linux seed inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-full-port-seed-${{ github.sha }}
          path: build/linux-port-seed

      - name: Bootstrap Linux stable
        run: bash ./script/linux_port_seed.sh bootstrap

      - name: Run backend CLI smoke
        run: JIANGC=build/bin/jiangc bash ./script/backend_cli_smoke.sh

      - name: Run compiler tests
        env:
          JIANGC: build/bin/jiangc
          TEST_JOBS: 2
          TEST_ROOT: test/compiler
          TEST_TIMEOUT: 300
        run: bash ./script/test.sh

      - name: Run language tests
        env:
          JIANGC: build/bin/jiangc
          TEST_JOBS: 2
          TEST_ROOT: test/lang
          TEST_TIMEOUT: 300
        run: bash ./script/test.sh

      - name: Build and verify Linux release package
        run: RELEASE_SMOKE_BUILD=0 bash ./script/release_smoke.sh

      - name: Upload Linux release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jiang-linux-x86_64-${{ github.sha }}
          path: build/release-smoke/dist/jiang-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux seed manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-full-seed-manifest-${{ github.sha }}
          path: build/linux-port-seed/jiangc-x86_64-linux-gnu.manifest
          if-no-files-found: warn
          retention-days: 14
