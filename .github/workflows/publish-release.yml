name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version from package.ini
        required: true
        default: 0.5.3
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos-release:
    name: Build macOS release and Linux seed
    runs-on: macos-15
    timeout-minutes: 120
    env:
      COMPILER_BUILD_MODE: release
      LLVM_SDK_CACHE_KEY: macos-arm64-user-jiang-llvm-22.1.8-1-15cf20d4e314879e
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check release version
        run: |
          package_version="$(sed -n \
            's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' package.ini | head -n 1)"
          if [ "$RELEASE_VERSION" != "$package_version" ]; then
            echo "release version $RELEASE_VERSION does not match package.ini $package_version" >&2
            exit 1
          fi

      - name: Download Jiang 0.5.2 stable
        env:
          ARCHIVE_SHA256: 61286852fa1552a68a4bbf80ae80a33a97361d01437fbcf127d034bc44b11a85
        run: |
          archive="$RUNNER_TEMP/jiang-0.5.2-macos-arm64.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/jjcfun/jiang/releases/download/0.5.2/jiang-0.5.2-macos-arm64.zip
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/jiang-0.5.2"

      - name: Restore managed LLVM SDK
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jiang/toolchains/llvm/22/darwin-arm64
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Install managed LLVM SDK
        run: bash ./script/install_llvm.sh --user

      - name: Save managed LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.jiang/toolchains/llvm/22/darwin-arm64
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Checkout Jiang 0.5.3 bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 661b3c21d167114fe13107d1d548e39916529079
          path: build/bootstrap-0.5.3

      - name: Build Jiang 0.5.3 bootstrap next
        env:
          BOOTSTRAP_BIN: ${{ runner.temp }}/jiang-0.5.2/jiang-0.5.2-macos-arm64/bin/jiangc
          BOOTSTRAP_RELEASE_VERSION: 0.5.2
        run: |
          VERIFY=none \
          BOOTSTRAP_DEPTH=next \
          BOOTSTRAP_CHECK_MODE=strict \
          bash ./build/bootstrap-0.5.3/script/build_next.sh

      - name: Bootstrap release compiler
        env:
          BOOTSTRAP_BIN: ${{ github.workspace }}/build/bootstrap-0.5.3/build/bin/jiangc.next
          BOOTSTRAP_RELEASE_VERSION: 0.5.3
        run: |
          VERIFY=none \
          BOOTSTRAP_DEPTH=stable \
          BOOTSTRAP_CHECK_MODE=strict \
          bash ./script/build_next.sh

      - name: Build macOS release package
        run: |
          DIST_DIR=build/release-dist \
          VERSION="$RELEASE_VERSION" \
          bash ./script/package_macos_release.sh

      - name: Emit reproducible Linux object
        env:
          BOOTSTRAP_BIN: ${{ github.workspace }}/build/bin/jiangc
          BOOTSTRAP_RELEASE_VERSION: ${{ inputs.version }}
        run: bash ./script/linux_port_seed.sh emit-object

      - name: Upload macOS release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ github.run_id }}
          path: build/release-dist/jiang-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux seed inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-seed-${{ github.run_id }}
          path: |
            build/linux-port-seed/jiangc-x86_64-linux-gnu.o
            build/linux-port-seed/jiangc-x86_64-linux-gnu.manifest
          if-no-files-found: error
          retention-days: 3

  linux-release:
    name: Build Linux release
    needs: macos-release
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      COMPILER_BUILD_MODE: release
      LLVM_SDK_CACHE_KEY: linux-x86_64-jiang-llvm-22.1.8-1-42596f306bfa7af4
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore managed LLVM SDK
        id: llvm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llvm/linux-x86_64/install
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Install managed LLVM SDK
        run: bash ./script/install_llvm.sh --local

      - name: Save managed LLVM SDK
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llvm/linux-x86_64/install
          key: ${{ env.LLVM_SDK_CACHE_KEY }}

      - name: Download Linux seed inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-seed-${{ github.run_id }}
          path: build/linux-port-seed

      - name: Bootstrap Linux stable
        env:
          BOOTSTRAP_RELEASE_VERSION: ${{ inputs.version }}
        run: bash ./script/linux_port_seed.sh bootstrap

      - name: Build Linux release package
        run: |
          DIST_DIR=build/release-dist \
          VERSION="$RELEASE_VERSION" \
          bash ./script/package_linux_release.sh

      - name: Upload Linux release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ github.run_id }}
          path: build/release-dist/jiang-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs:
      - macos-release
      - linux-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download macOS release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ github.run_id }}
          path: dist

      - name: Download Linux release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ github.run_id }}
          path: dist

      - name: Prepare release assets
        run: |
          test -s "dist/jiang-$RELEASE_VERSION-macos-arm64.zip"
          test -s "dist/jiang-$RELEASE_VERSION-linux-x86_64.tar.gz"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "release $RELEASE_VERSION already exists" >&2
            exit 1
          fi
          (cd dist && sha256sum jiang-* >"jiang-$RELEASE_VERSION-SHA256SUMS")

      - name: Create draft release and upload assets
        run: |
          gh release create "$RELEASE_VERSION" \
            "dist/jiang-$RELEASE_VERSION-macos-arm64.zip" \
            "dist/jiang-$RELEASE_VERSION-linux-x86_64.tar.gz" \
            "dist/jiang-$RELEASE_VERSION-SHA256SUMS" \
            --draft \
            --notes-file "doc/releases/$RELEASE_VERSION.md" \
            --target "$GITHUB_SHA" \
            --title "Jiang $RELEASE_VERSION"

      - name: Publish release
        run: gh release edit "$RELEASE_VERSION" --draft=false
